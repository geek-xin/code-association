server:
  port: 9996
  compression:
    enabled: true

spring:
  application:
    name: code-association
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        # The jar is built reproducibly, so every entry carries the same 1980 timestamp and
        # Last-Modified never changes. Revalidation against it would always answer 304 and the
        # browser would keep stale CSS/JS after a rebuild, so do not use it as a validator.
        use-last-modified: false
        cachecontrol:
          no-cache: true

code-association:
  data-dir: ./.code-association
  max-files: 20000
  # Largest single file the indexer will read, in megabytes. Source files are kilobytes; anything
  # near this is a committed SDK, a database dump or a packaged jar under another extension.
  # The size is checked before the content is loaded, and a file above it is skipped and named in
  # the report instead of failing the run. Set to 0 to read every file regardless of size.
  max-file-mb: 20
  max-depth: 8
  # Daily proactive scan: analyse programs that received new commits, without anyone pressing a
  # button. Only programs whose HEAD moved since their last finished analysis are run, and each
  # run compares that program against every other program.
  schedule:
    enabled: true
    cron: "0 30 2 * * *"   # every day at 02:30
    run-on-startup: false
    max-programs-per-run: 20
    directory-rescan-minutes: 1440
  # Self-update from the project's GitHub releases. Checking is read-only; nothing is downloaded or
  # replaced until someone presses the button in the UI.
  update:
    # On by default: an installation that never learns a new version exists is what this feature
    # exists to fix. Turn it off for air-gapped hosts, where every check would only log a failure.
    enabled: true
    # Releases are read from this repository's tags. Change it for a fork.
    repo: geek-xin/code-association
    # Optional. Anonymous GitHub allows 60 requests/hour per IP; a token raises it to 5000. It is
    # read from the environment so no secret has to live in this file.
    token: ${GITHUB_TOKEN:}
    # How long a successful check is reused. Six hours keeps polling the UI free of API calls while
    # still noticing a release the same working day.
    check-interval-minutes: 360
    # Background re-check. Hourly is enough for a release cadence measured in days, and the result
    # is cached anyway; cron format is second minute hour day-of-month month day-of-week.
    cron: "0 0 * * * *"
    # Upper bound on the history list. Each entry carries its notes and assets, so the payload grows
    # with this number and 20 covers a typical release history without bloating the response.
    max-releases: 20
    # Pre-releases are built for testing; offering them as "the latest version" would push an
    # unfinished build onto every installation. Enable only when deliberately testing one.
    include-prerelease: false
    # Read bare git tags as well as releases. Releases are tags with notes and assets, but a tag is
    # sometimes pushed before (or without) its release, and those versions must still appear in the
    # history. A tag that has no jar asset can be seen but not downloaded in place.
    include-tags: true
    # Fetch a newly discovered jar in the background so it is ready when someone presses 应用更新.
    # Off by default: the download is tens of MB and applying is still a manual decision.
    auto-download: false
    # Replace the running jar and bring the process back without anyone running stop.sh/start.sh.
    # The supervisor health-checks the new process and restores the backup when it does not come
    # up, so the worst case is a short outage rather than an installation that no longer starts.
    auto-restart: true
    # Do the whole thing unattended (download -> apply -> restart) as soon as a newer installable
    # version appears. Off by default: restarting a service is disruptive and the operator should
    # be the one who decides that nobody is watching.
    auto-apply: false
    # How long the supervisor waits for the new process to answer /api/health before it restores
    # the backup and starts the old jar again.
    restart-timeout-seconds: 90
    # GitHub API hosts tried in order. The first is canonical; the rest are mirrors used only when
    # it cannot be reached. A mirror must speak the GitHub REST API under the same paths (a proxy
    # or a self-hosted replica), not a release page.
    api-base-urls:
      - https://api.github.com
    # Prefix prepended to asset download URLs to route them through a mirror, e.g. https://ghfast.top
    # Release assets are served from a CDN that is blocked in some networks while the API itself is
    # reachable, so this is deliberately separate from api-base-urls. Empty means direct download.
    download-mirror: ""
    # Optional proxy for update traffic only: host:port or http://user:pass@host:port. Empty means
    # "use the JVM's own proxy settings", which is what -Dhttps.proxyHost and HTTPS_PROXY become.
    proxy: ${UPDATE_PROXY:}
    # Extra attempts per request after the first failure. A flaky connection is the common case on
    # a blocked network; a permanent 404 is not retried, because it cannot become a 200.
    retries: 2
    # Base delay of the exponential backoff between attempts, milliseconds (500 -> 1000 -> 2000).
    retry-base-delay-ms: 500
    # Once GitHub reports the quota as exhausted, stop retrying until the reported reset time.
    # Without it a retry loop turns "wait until 14:05" into "stay limited for the rest of the hour".
    respect-rate-limit: true
    # Run one check shortly after startup instead of waiting for the first cron boundary.
    check-on-startup: true
  # Optional LLM review layer. Off by default: every conclusion in a report comes from static
  # analysis, and the model only restates those facts in review language. When it is off, nothing
  # is sent anywhere and the report is byte-for-byte what it was before this feature existed.
  # The settings page writes its own snapshot to {data-dir}/ai-settings.json and overrides the
  # values below on startup; this block stays the baseline for a headless/CLI install.
  ai:
    enabled: false
    # OpenAI-compatible endpoint, e.g. https://api.deepseek.com/v1, https://api.openai.com/v1 or
    # http://localhost:11434/v1 for a local Ollama. "/chat/completions" is appended when missing.
    base-url: ""
    # Read from the environment so no secret has to be committed. Empty is valid: a local model
    # needs no key, which is why the key is not part of the "configured" check.
    api-key: ${AI_API_KEY:}
    # Model name as the endpoint spells it, e.g. deepseek-chat, gpt-4o-mini, qwen2.5-coder:7b.
    model: ""
    # How many impact rows are sent to the model per call (1..50). The prompt is the cost, and the
    # first dozen findings carry almost all of the review value.
    max-impacts: 12
    # Wall-clock limit of one model request (5..300). The analysis is already finished by the time
    # this runs, so a dead endpoint must not hold the run open.
    timeout-seconds: 60
    # Default state of the "generate AI review" checkbox in the run dialog. Each run can still say
    # no, and this has no effect while enabled is false.
    default-for-runs: true

logging:
  level:
    root: INFO
    com.geek.association: INFO
    org.eclipse.jgit: WARN
