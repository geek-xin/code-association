server:
  port: 9996
  compression:
    enabled: true

spring:
  application:
    name: code-association
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        # The jar is built reproducibly, so every entry carries the same 1980 timestamp and
        # Last-Modified never changes. Revalidation against it would always answer 304 and the
        # browser would keep stale CSS/JS after a rebuild, so do not use it as a validator.
        use-last-modified: false
        cachecontrol:
          no-cache: true

code-association:
  data-dir: ./.code-association
  max-files: 20000
  max-depth: 8
  # Daily proactive scan: analyse programs that received new commits, without anyone pressing a
  # button. Only programs whose HEAD moved since their last finished analysis are run, and each
  # run compares that program against every other program.
  schedule:
    enabled: true
    cron: "0 30 2 * * *"   # every day at 02:30
    run-on-startup: false
    max-programs-per-run: 20
    directory-rescan-minutes: 1440
  # Self-update from the project's GitHub releases. Checking is read-only; nothing is downloaded or
  # replaced until someone presses the button in the UI.
  update:
    # On by default: an installation that never learns a new version exists is what this feature
    # exists to fix. Turn it off for air-gapped hosts, where every check would only log a failure.
    enabled: true
    # Releases are read from this repository's tags. Change it for a fork.
    repo: geek-xin/code-association
    # Optional. Anonymous GitHub allows 60 requests/hour per IP; a token raises it to 5000. It is
    # read from the environment so no secret has to live in this file.
    token: ${GITHUB_TOKEN:}
    # How long a successful check is reused. Six hours keeps polling the UI free of API calls while
    # still noticing a release the same working day.
    check-interval-minutes: 360
    # Background re-check. Hourly is enough for a release cadence measured in days, and the result
    # is cached anyway; cron format is second minute hour day-of-month month day-of-week.
    cron: "0 0 * * * *"
    # Upper bound on the history list. Each entry carries its notes and assets, so the payload grows
    # with this number and 20 covers a typical release history without bloating the response.
    max-releases: 20
    # Pre-releases are built for testing; offering them as "the latest version" would push an
    # unfinished build onto every installation. Enable only when deliberately testing one.
    include-prerelease: false
    # Read bare git tags as well as releases. Releases are tags with notes and assets, but a tag is
    # sometimes pushed before (or without) its release, and those versions must still appear in the
    # history. A tag that has no jar asset can be seen but not downloaded in place.
    include-tags: true
    # Fetch a newly discovered jar in the background so it is ready when someone presses 应用更新.
    # Off by default: the download is tens of MB and applying is still a manual decision.
    auto-download: false
  ai:
    enabled: false
    base-url: ""
    api-key: ""
    model: ""

logging:
  level:
    root: INFO
    com.geek.association: INFO
    org.eclipse.jgit: WARN
